<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NFC Kitchen Magic</title>

<style>
:root{
  --bg:#0b0f0d;
  --panel:#121814;
  --text:#f5f7f5;
  --muted:#98a39b;
  --green:#57e36d;
  --line:#263028;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(180deg,#07100a,#0b0f0d 35%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 100px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.brand span{
  color:var(--green);
}

.small{
  color:var(--muted);
  font-size:13px;
}

.hero{
  background:linear-gradient(135deg,#173b20,#102418);
  border:1px solid #24582f;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#c3d2c7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  border-radius:20px;
  padding:16px;
  min-height:135px;
  cursor:pointer;
}

.card .icon{
  font-size:30px;
  margin-bottom:16px;
}

.card h3{
  margin:0 0 6px;
}

.card p{
  margin:0;
  font-size:13px;
}

.green{
  background:linear-gradient(135deg,#1c8b36,#2db94a);
}

.blue{
  background:linear-gradient(135deg,#285ca0,#4c92e8);
}

.purple{
  background:linear-gradient(135deg,#6635a0,#9863df);
}

.orange{
  background:linear-gradient(135deg,#ba5c0a,#f58f20);
}

.section{
  margin-top:20px;
}

.section h2{
  font-size:18px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

input{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0f1411;
  color:white;
  outline:none;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 14px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:var(--green);
  color:#08100a;
}

.btn2{
  background:#1a211c;
  color:white;
  border:1px solid var(--line);
}

.controls{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.tabs{
  display:flex;
  gap:8px;
  margin:12px 0;
  overflow:auto;
}

.tab{
  padding:9px 13px;
  border-radius:50px;
  background:#151b17;
  border:1px solid var(--line);
  white-space:nowrap;
  cursor:pointer;
}

.tab.active{
  background:var(--green);
  color:#08100a;
  font-weight:bold;
}

.recipe{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
}

.recipe h3{
  margin:0 0 7px;
}

.recipe p{
  color:var(--muted);
  font-size:13px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#0a0e0b;
  border-top:1px solid var(--line);
  padding:10px 5px 18px;
}

.nav{
  text-align:center;
  color:#9da7a0;
  font-size:11px;
  cursor:pointer;
}

.nav b{
  display:block;
  font-size:22px;
}

.nav.active{
  color:var(--green);
}

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1b2a1f;
  border:1px solid #2c6a39;
  padding:10px 15px;
  border-radius:50px;
  display:none;
  z-index:100;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:end;
  justify-content:center;
  z-index:50;
}

.modal.show{
  display:flex;
}

.sheet{
  width:min(520px,100%);
  background:#101612;
  border-radius:24px 24px 0 0;
  padding:20px;
}
</style>
</head>

<body>

<div class="toast" id="toast">
Added
</div>

<div class="app">

<div class="top">

<div>
<div class="brand">
NFC Kitchen <span>Magic</span>
</div>

<div class="small">
Smart grocery + meal finder
</div>
</div>

<div>
👤
</div>

</div>


<!-- HOME -->

<section id="home" class="page active">

<div class="hero">

<h1>
What's cooking today?
</h1>

<p>
Use what you already have, add groceries with NFC, and find quick meal ideas.
</p>

</div>


<div class="grid">

<div class="card green" onclick="go('meals')">

<div class="icon">
🍲
</div>

<h3>
Find a Meal
</h3>

<p>
Meal ideas from your kitchen
</p>

</div>


<div class="card blue" onclick="go('kitchen')">

<div class="icon">
🧊
</div>

<h3>
My Kitchen
</h3>

<p>
Pantry, fridge and freezer
</p>

</div>


<div class="card purple" onclick="go('list')">

<div class="icon">
🛒
</div>

<h3>
Grocery List
</h3>

<p>
View and manage your list
</p>

</div>


<div class="card orange" onclick="openAdd()">

<div class="icon">
📡
</div>

<h3>
Scan / Tap Item
</h3>

<p>
Quick add an item
</p>

</div>

</div>


<div class="section">

<h2>
Quick Add
</h2>

<div class="list" id="quick">
</div>

</div>

</section>



<!-- KITCHEN -->

<section id="kitchen" class="page">

<h1>
My Kitchen
</h1>

<div class="controls">

<input
id="inventoryInput"
placeholder="Add item to kitchen"
/>

<button
class="btn"
onclick="addInventory()"
>
Add
</button>

</div>

<div
class="section list"
id="inventory">
</div>

</section>



<!-- GROCERY LIST -->

<section id="list" class="page">

<h1>
Grocery List
</h1>

<div class="controls">

<input
id="groceryInput"
placeholder="Milk, eggs, bread..."
/>

<button
class="btn"
onclick="addGrocery()"
>
Add
</button>

</div>

<div
class="section list"
id="grocery">
</div>

<button
class="btn2"
style="width:100%;margin-top:12px;"
onclick="clearBought()"
>

Clear purchased

</button>

</section>



<!-- MEALS -->

<section id="meals" class="page">

<h1>
Find a Meal
</h1>

<div class="small">
How much time do you have?
</div>

<div class="tabs">

<div
class="tab active"
onclick="setTime(this,15)"
>
15 min
</div>

<div
class="tab"
onclick="setTime(this,30)"
>
30 min
</div>

<div
class="tab"
onclick="setTime(this,60)"
>
60 min
</div>

<div
class="tab"
onclick="setTime(this,999)"
>
Any
</div>

</div>


<button
class="btn"
style="width:100%;margin-bottom:15px;"
onclick="findMeals()"
>

✨ Find Meals From My Kitchen

</button>

<div id="recipes">
</div>

</section>

</div>



<!-- NAVIGATION -->

<div class="bottom">

<div
class="nav active"
data-page="home"
onclick="go('home')"
>

<b>⌂</b>

Home

</div>


<div
class="nav"
data-page="kitchen"
onclick="go('kitchen')"
>

<b>▦</b>

Kitchen

</div>


<div
class="nav"
data-page="meals"
onclick="go('meals')"
>

<b>✦</b>

Meals

</div>


<div
class="nav"
data-page="list"
onclick="go('list')"
>

<b>☷</b>

List

</div>

</div>



<!-- NFC QUICK ADD -->

<div
class="modal"
id="modal"
>

<div class="sheet">

<h2>
Quick Add Item
</h2>

<p class="small">
This will later connect to your NFC stickers.
</p>

<input
id="nfcInput"
placeholder="Example: Milk"
/>

<button
class="btn"
style="width:100%;margin-top:10px;"
onclick="nfcAdd()"
>

Add to Grocery List

</button>


<button
class="btn2"
style="width:100%;margin-top:8px;"
onclick="closeAdd()"
>

Cancel

</button>

</div>

</div>



<script>

let groceries =
JSON.parse(
localStorage.getItem("groceries") || "[]"
);


let inventory =
JSON.parse(
localStorage.getItem("inventory") ||
'["Rice","Chicken breast","Eggs","Onion","Tomato sauce","Cheese","Milk","Tortillas"]'
);


let cookTime = 15;


const quickItems = [

"Milk",
"Eggs",
"Bread",
"Chicken",
"Rice",
"Coffee"

];


function save(){

localStorage.setItem(
"groceries",
JSON.stringify(groceries)
);

localStorage.setItem(
"inventory",
JSON.stringify(inventory)
);

}


function toast(text){

let t =
document.getElementById("toast");

t.textContent = text;

t.style.display = "block";

setTimeout(()=>{

t.style.display = "none";

},1400);

}



function go(id){

document
.querySelectorAll(".page")
.forEach(page=>{

page.classList.remove("active");

});


document
.getElementById(id)
.classList.add("active");


document
.querySelectorAll(".nav")
.forEach(nav=>{

nav.classList.toggle(
"active",
nav.dataset.page === id
);

});

render();

}



function render(){

document.getElementById("quick").innerHTML =

quickItems.map(item=>`

<div class="row">

<div class="left">

<span>
📦
</span>

<b>
${item}
</b>

</div>

<button
class="btn2"
onclick="quickAdd('${item}')"
>

+ Add

</button>

</div>

`).join("");



document.getElementById("inventory").innerHTML =

inventory.map((item,index)=>`

<div class="row">

<div class="left">

<span>
🍽️
</span>

<div>

<b>
${item}
</b>

<div class="small">
In stock
</div>

</div>

</div>

<button
class="btn2"
onclick="removeInventory(${index})"
>

Remove

</button>

</div>

`).join("");



if(groceries.length === 0){

document.getElementById("grocery").innerHTML =

'<div class="small">Your grocery list is empty.</div>';

}else{

document.getElementById("grocery").innerHTML =

groceries.map((item,index)=>`

<div class="row">

<div class="left">

<input
type="checkbox"
style="width:20px;height:20px;"
${item.done ? "checked" : ""}
onchange="toggleBought(${index})"
/>

<div>

<b style="
${item.done ? "text-decoration:line-through;opacity:.5;" : ""}
">

${item.name}

</b>

<div class="small">

${item.source || "Manual"}

</div>

</div>

</div>


<button
class="btn2"
onclick="removeGrocery(${index})"
>

×

</button>

</div>

`).join("");

}

}



function quickAdd(name){

groceries.push({

name:name,

done:false,

source:"NFC Quick Add"

});

save();

render();

toast(
name + " added"
);

}



function addGrocery(){

let input =
document.getElementById("groceryInput");

let value =
input.value.trim();

if(!value){

return;

}

groceries.push({

name:value,

done:false,

source:"Manual"

});

input.value = "";

save();

render();

toast("Added");

}



function addInventory(){

let input =
document.getElementById("inventoryInput");

let value =
input.value.trim();

if(!value){

return;

}

inventory.push(value);

input.value = "";

save();

render();

toast(
"Kitchen updated"
);

}



function removeInventory(index){

inventory.splice(
index,
1
);

save();

render();

}



function removeGrocery(index){

groceries.splice(
index,
1
);

save();

render();

}



function toggleBought(index){

groceries[index].done =
!groceries[index].done;

save();

render();

}



function clearBought(){

groceries =
groceries.filter(
item=>!item.done
);

save();

render();

}



function openAdd(){

document
.getElementById("modal")
.classList.add("show");

}



function closeAdd(){

document
.getElementById("modal")
.classList.remove("show");

}



function nfcAdd(){

let input =
document.getElementById("nfcInput");

let value =
input.value.trim();

if(!value){

return;

}

groceries.push({

name:value,

done:false,

source:"NFC Tag"

});

input.value = "";

closeAdd();

save();

render();

toast(
"NFC item added"
);

}



function setTime(element,time){

cookTime = time;

document
.querySelectorAll("#meals .tab")
.forEach(tab=>{

tab.classList.remove("active");

});

element
.classList.add("active");

}



function findMeals(){

const kitchen =
inventory.map(
item=>item.toLowerCase()
);


const meals = [

{

name:"Chicken Rice Bowl",

time:25,

need:[
"chicken breast",
"rice",
"onion"
],

missing:[
"garlic",
"soy sauce"
]

},

{

name:"Chicken Quesadillas",

time:20,

need:[
"chicken breast",
"cheese",
"tortillas"
],

missing:[
"salsa"
]

},

{

name:"Egg Fried Rice",

time:15,

need:[
"eggs",
"rice",
"onion"
],

missing:[
"soy sauce"
]

},

{

name:"Cheesy Tomato Rice",

time:20,

need:[
"rice",
"tomato sauce",
"cheese"
],

missing:[
"herbs"
]

},

{

name:"Breakfast Quesadilla",

time:12,

need:[
"eggs",
"cheese",
"tortillas"
],

missing:[
"hot sauce"
]

}

];


let results =

meals

.filter(
meal =>
meal.time <= cookTime
)

.map(meal=>{

let owned =
meal.need.filter(
ingredient=>
kitchen.includes(ingredient)
).length;

return{

...meal,

score:
owned /
meal.need.length

};

})

.sort(
(a,b)=>
b.score-a.score
)

.slice(
0,
4
);



document.getElementById("recipes").innerHTML =

results.map((meal,index)=>`

<div class="recipe">

<h3>

${index === 0 ? "⭐ " : ""}

${meal.name}

</h3>

<p>

⏱ ${meal.time} min

</p>

<p>

You have

<b>

${Math.round(meal.score*100)}%

</b>

of the main ingredients.

</p>

<p>

<b>
Uses:
</b>

${meal.need.join(", ")}

</p>

<button
class="btn2"
onclick='addMissing(${JSON.stringify(meal.missing)})'
>

Add Missing Ingredients

</button>

</div>

`).join("");

}



function addMissing(items){

items.forEach(item=>{

let alreadyExists =
groceries.some(
g =>
g.name.toLowerCase() ===
item.toLowerCase()
);

if(!alreadyExists){

groceries.push({

name:item,

done:false,

source:"Meal Finder"

});

}

});

save();

render();

toast(
"Missing ingredients added"
);

}



/* REAL NFC URL SUPPORT

Example:

yoursite.com/?add=Milk

yoursite.com/?add=Eggs

*/

function checkNFCLink(){

const params =
new URLSearchParams(
window.location.search
);

const item =
params.get("add");

if(item){

let exists =
groceries.some(
g =>
g.name.toLowerCase() ===
item.toLowerCase() &&
!g.done
);

if(!exists){

groceries.push({

name:item,

done:false,

source:"NFC Tag"

});

save();

}

toast(
item + " added from NFC"
);


/* Remove ?add= from URL
so refreshing does not add it again */

window.history.replaceState(
{},
document.title,
window.location.pathname
);

}

}



render();

findMeals();

checkNFCLink();

</script>

</body>
</html>
