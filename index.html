<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5">

<title>KitchenTap</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f8f5;
  color:#151915;
}

.app{
  max-width:520px;
  margin:auto;
  padding:22px 18px 100px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#22a35a;
}

.subtitle{
  color:#747b75;
  font-size:13px;
  margin-top:3px;
}

.card{
  background:white;
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 6px 25px rgba(0,0,0,.045);
}

.hero{
  background:#172019;
  color:white;
  padding:22px;
}

.hero p{
  color:#cbd3cd;
  margin:8px 0 18px;
  line-height:1.5;
}

button{
  border:none;
  font:inherit;
  cursor:pointer;
}

.primary{
  width:100%;
  padding:15px;
  border-radius:15px;
  background:#22a35a;
  color:white;
  font-weight:750;
  font-size:15px;
}

.secondary{
  padding:12px 14px;
  border-radius:13px;
  background:#edf7f0;
  color:#168449;
  font-weight:700;
}

.danger{
  padding:12px 14px;
  border-radius:13px;
  background:#fff0f0;
  color:#b53b3b;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.homeButton{
  background:white;
  border-radius:20px;
  padding:20px 16px;
  text-align:left;
  box-shadow:0 6px 25px rgba(0,0,0,.045);
}

.homeIcon{
  font-size:27px;
  margin-bottom:12px;
}

.homeTitle{
  font-weight:800;
  font-size:16px;
}

.homeSmall{
  color:#7c837d;
  font-size:12px;
  margin-top:5px;
}

.sectionTitle{
  font-size:22px;
  font-weight:800;
  margin:4px 0 18px;
}

.back{
  background:none;
  color:#168449;
  padding:0;
  font-weight:700;
  margin-bottom:16px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #edf0ed;
}

.row:last-child{
  border-bottom:none;
}

.itemName{
  font-weight:650;
}

.small{
  font-size:12px;
  color:#7b827c;
}

input[type=text]{
  width:100%;
  padding:15px;
  border:1px solid #e2e7e2;
  border-radius:14px;
  font-size:16px;
  outline:none;
  margin-bottom:10px;
}

input[type=text]:focus{
  border-color:#22a35a;
}

.quickGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.quick{
  padding:13px;
  border-radius:13px;
  background:#f1f5f1;
  font-weight:700;
}

.meal{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:13px;
  box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.mealTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.mealName{
  font-size:17px;
  font-weight:800;
}

.time{
  color:#168449;
  font-weight:700;
  font-size:13px;
}

.ingredients{
  margin-top:14px;
  font-size:14px;
  line-height:1.9;
}

.have{
  color:#168449;
}

.missing{
  color:#b46b1c;
}

.mealActions{
  margin-top:12px;
}

.timeFilters{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:16px;
}

.timeFilter{
  padding:9px 13px;
  border-radius:20px;
  white-space:nowrap;
  background:#e9eee9;
}

.timeFilter.active{
  background:#172019;
  color:white;
}

.groceryDone .itemName{
  text-decoration:line-through;
  opacity:.5;
}

.checkbox{
  width:22px;
  height:22px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

/* MULTI SCAN */

.scannerWrap{
  position:relative;
  overflow:hidden;
  background:#101310;
  border-radius:22px;
  min-height:320px;
}

#scannerVideo{
  display:block;
  width:100%;
  min-height:320px;
  object-fit:cover;
}

.scanOverlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.scanBox{
  width:220px;
  height:220px;
  border:3px solid white;
  border-radius:24px;
  box-shadow:0 0 0 999px rgba(0,0,0,.25);
}

.scanStatus{
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  background:#edf7f0;
  color:#168449;
  font-weight:700;
  text-align:center;
}

.scanItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #edf0ed;
}

.scanItem:last-child{
  border-bottom:none;
}

.removeScan{
  background:#fff0f0;
  color:#b53b3b;
  width:31px;
  height:31px;
  border-radius:50%;
  font-weight:800;
}

.counter{
  background:#172019;
  color:white;
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:750;
}

.empty{
  color:#858b86;
  text-align:center;
  padding:24px 10px;
}

.toast{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#172019;
  color:white;
  padding:13px 18px;
  border-radius:30px;
  font-size:13px;
  font-weight:700;
  transition:.25s;
  z-index:1000;
  max-width:90%;
  text-align:center;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="home" class="page active">

  <div class="topbar">
    <div>
      <div class="logo">Kitchen<span>Tap</span></div>
      <div class="subtitle">Your kitchen. Smarter.</div>
    </div>
  </div>

  <div class="card hero">
    <h2 style="margin:0;">What's running low?</h2>
    <p>Tap, scan or select what you need and KitchenTap will build your grocery list.</p>
    <button class="primary" onclick="openPage('scanner')">
      📷 Start Multi Scan
    </button>
  </div>

  <div class="grid">

    <button class="homeButton" onclick="openPage('scanner')">
      <div class="homeIcon">📷</div>
      <div class="homeTitle">Multi Scan</div>
      <div class="homeSmall">Scan several items</div>
    </button>

    <button class="homeButton" onclick="openPage('groceries')">
      <div class="homeIcon">🛒</div>
      <div class="homeTitle">Grocery List</div>
      <div class="homeSmall" id="groceryCountHome">0 items</div>
    </button>

    <button class="homeButton" onclick="openPage('kitchen')">
      <div class="homeIcon">🏠</div>
      <div class="homeTitle">My Kitchen</div>
      <div class="homeSmall" id="kitchenCountHome">0 items</div>
    </button>

    <button class="homeButton" onclick="openPage('meals')">
      <div class="homeIcon">🍽️</div>
      <div class="homeTitle">Meal Finder</div>
      <div class="homeSmall">Cook with what you have</div>
    </button>

    <button class="homeButton" onclick="openPage('quick')">
      <div class="homeIcon">➕</div>
      <div class="homeTitle">Quick Add</div>
      <div class="homeSmall">Add common groceries</div>
    </button>

  </div>

</section>


<!-- MULTI SCAN -->

<section id="scanner" class="page">

  <button class="back" onclick="closeScanner()">← Home</button>

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div class="sectionTitle">Multi Scan</div>
    <div class="counter" id="scanCounter">0 scanned</div>
  </div>

  <div class="scannerWrap">

    <video id="scannerVideo" playsinline muted></video>

    <div class="scanOverlay">
      <div class="scanBox"></div>
    </div>

  </div>

  <div id="scanStatus" class="scanStatus">
    Tap Start Camera
  </div>

  <div class="actions">
    <button class="primary" id="startScanButton" onclick="startScanner()">
      📷 Start Camera
    </button>
  </div>

  <div class="card" style="margin-top:15px;">

    <div style="font-weight:800;margin-bottom:5px;">
      Scanned Items
    </div>

    <div class="small">
      Keep scanning. Add everything when you're finished.
    </div>

    <div id="scannedItems"></div>

  </div>

  <button class="primary" onclick="finishMultiScan()">
    Add All to Grocery List
  </button>

  <div class="actions">

    <button class="secondary" onclick="undoLastScan()">
      ↶ Undo
    </button>

    <button class="danger" onclick="clearScans()">
      Clear
    </button>

  </div>

</section>


<!-- GROCERY LIST -->

<section id="groceries" class="page">

  <button class="back" onclick="openPage('home')">← Home</button>

  <div class="sectionTitle">Grocery List</div>

  <div class="card">

    <input
      id="groceryInput"
      type="text"
      placeholder="Add an item..."
      onkeydown="if(event.key==='Enter') manualAddGrocery()"
    >

    <button class="primary" onclick="manualAddGrocery()">
      Add Item
    </button>

  </div>

  <div class="card" id="groceryList"></div>

  <div class="actions">

    <button class="secondary" onclick="movePurchasedToKitchen()">
      Put Purchased in Kitchen
    </button>

    <button class="secondary" onclick="clearPurchased()">
      Clear Purchased
    </button>

    <button class="danger" onclick="clearAllGroceries()">
      Clear All
    </button>

  </div>

</section>


<!-- MY KITCHEN -->

<section id="kitchen" class="page">

  <button class="back" onclick="openPage('home')">← Home</button>

  <div class="sectionTitle">My Kitchen</div>

  <div class="card">

    <input
      id="kitchenInput"
      type="text"
      placeholder="Add kitchen item..."
      onkeydown="if(event.key==='Enter') addKitchenItem()"
    >

    <button class="primary" onclick="addKitchenItem()">
      Add to Kitchen
    </button>

  </div>

  <div class="card" id="kitchenList"></div>

</section>


<!-- QUICK ADD -->

<section id="quick" class="page">

  <button class="back" onclick="openPage('home')">← Home</button>

  <div class="sectionTitle">Quick Add</div>

  <div class="card">

    <div class="quickGrid" id="quickGrid"></div>

  </div>

</section>


<!-- MEALS -->

<section id="meals" class="page">

  <button class="back" onclick="openPage('home')">← Home</button>

  <div class="sectionTitle">Meal Finder</div>

  <div class="timeFilters">

    <button class="timeFilter active" onclick="setCookTime(60,this)">
      All
    </button>

    <button class="timeFilter" onclick="setCookTime(15,this)">
      15 min
    </button>

    <button class="timeFilter" onclick="setCookTime(20,this)">
      20 min
    </button>

    <button class="timeFilter" onclick="setCookTime(30,this)">
      30 min
    </button>

  </div>

  <div id="mealResults"></div>

</section>

</div>

<div id="toast" class="toast"></div>


<script>

/* -----------------------------
DATA
----------------------------- */

const quickItems = [
  "Milk",
  "Eggs",
  "Bread",
  "Chicken breast",
  "Rice",
  "Coffee"
];

const meals = [

  {
    name:"Chicken Rice Bowl",
    time:25,
    ingredients:[
      "Chicken breast",
      "Rice",
      "Onion",
      "Garlic",
      "Soy sauce"
    ]
  },

  {
    name:"Chicken Quesadillas",
    time:20,
    ingredients:[
      "Chicken breast",
      "Cheese",
      "Tortillas",
      "Salsa"
    ]
  },

  {
    name:"Egg Fried Rice",
    time:15,
    ingredients:[
      "Eggs",
      "Rice",
      "Onion",
      "Soy sauce"
    ]
  },

  {
    name:"Cheesy Tomato Rice",
    time:20,
    ingredients:[
      "Rice",
      "Tomato sauce",
      "Cheese",
      "Herbs"
    ]
  },

  {
    name:"Breakfast Quesadilla",
    time:12,
    ingredients:[
      "Eggs",
      "Cheese",
      "Tortillas",
      "Hot sauce"
    ]
  },

  {
    name:"Chicken Tomato Pasta",
    time:30,
    ingredients:[
      "Chicken breast",
      "Pasta",
      "Tomato sauce",
      "Onion",
      "Garlic"
    ]
  }

];


let inventory =
  JSON.parse(localStorage.getItem("kitchentap_inventory"))
  ||
  [
    "Rice",
    "Chicken breast",
    "Eggs",
    "Onion",
    "Tomato sauce",
    "Cheese",
    "Milk",
    "Tortillas"
  ];


let groceries =
  JSON.parse(localStorage.getItem("kitchentap_groceries"))
  || [];


let cookTime = 60;


/* -----------------------------
HELPERS
----------------------------- */

function normalize(value){
  return String(value)
    .trim()
    .toLowerCase();
}


function save(){

  localStorage.setItem(
    "kitchentap_inventory",
    JSON.stringify(inventory)
  );

  localStorage.setItem(
    "kitchentap_groceries",
    JSON.stringify(groceries)
  );

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* -----------------------------
NAVIGATION
----------------------------- */

function openPage(id){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);

  render();

}


/* -----------------------------
GROCERIES
----------------------------- */

function addToGroceryList(
  name,
  source="Manual"
){

  name = String(name).trim();

  if(!name)
    return false;


  const existing =
    groceries.find(item =>
      normalize(item.name)
      ===
      normalize(name)
      &&
      !item.done
    );


  if(existing)
    return false;


  groceries.push({
    name:name,
    done:false,
    source:source
  });


  save();
  render();

  return true;

}


function manualAddGrocery(){

  const input =
    document.getElementById(
      "groceryInput"
    );

  const name =
    input.value.trim();

  if(!name)
    return;


  const added =
    addToGroceryList(
      name,
      "Manual"
    );


  if(added){

    showToast(
      name + " added"
    );

  }else{

    showToast(
      name + " is already on your list"
    );

  }


  input.value="";

}


function toggleGrocery(index){

  groceries[index].done =
    !groceries[index].done;

  save();
  render();

}


function deleteGrocery(index){

  groceries.splice(index,1);

  save();
  render();

}


function putInKitchen(index){

  const grocery =
    groceries[index];

  if(!grocery)
    return;


  const itemName =
    grocery.name;


  const alreadyInKitchen =
    inventory.some(item =>
      normalize(item)
      ===
      normalize(itemName)
    );


  if(!alreadyInKitchen){

    inventory.push(
      itemName
    );

  }


  groceries.splice(
    index,
    1
  );


  save();
  render();
  findMeals();


  if(alreadyInKitchen){

    showToast(
      itemName +
      " was already in your kitchen"
    );

  }else{

    showToast(
      itemName +
      " moved to your kitchen"
    );

  }

}


function movePurchasedToKitchen(){

  const purchased =
    groceries.filter(
      item=>item.done
    );


  if(
    purchased.length===0
  ){

    showToast(
      "Check purchased items first"
    );

    return;

  }


  let addedCount=0;


  purchased.forEach(
    grocery=>{

      const exists =
        inventory.some(
          item =>
            normalize(item)
            ===
            normalize(
              grocery.name
            )
        );


      if(!exists){

        inventory.push(
          grocery.name
        );

        addedCount++;

      }

    }
  );


  groceries =
    groceries.filter(
      item=>!item.done
    );


  save();
  render();
  findMeals();


  showToast(
    addedCount +
    " item" +
    (
      addedCount===1
      ? ""
      : "s"
    ) +
    " moved to your kitchen"
  );

}


function clearPurchased(){

  groceries =
    groceries.filter(
      item=>!item.done
    );

  save();
  render();

}


function clearAllGroceries(){

  if(
    !confirm(
      "Clear your entire grocery list?"
    )
  )
    return;


  groceries=[];

  save();
  render();

}


/* -----------------------------
KITCHEN
----------------------------- */

function addKitchenItem(){

  const input =
    document.getElementById(
      "kitchenInput"
    );

  const name =
    input.value.trim();

  if(!name)
    return;


  const exists =
    inventory.some(
      item =>
        normalize(item)
        ===
        normalize(name)
    );


  if(exists){

    showToast(
      name +
      " is already in your kitchen"
    );

    input.value="";

    return;

  }


  inventory.push(name);

  input.value="";

  save();
  render();
  findMeals();

  showToast(
    name +
    " added to kitchen"
  );

}


function removeKitchenItem(index){

  inventory.splice(
    index,
    1
  );

  save();
  render();
  findMeals();

}


/* -----------------------------
MEALS
----------------------------- */

function setCookTime(
  time,
  button
){

  cookTime=time;


  document
    .querySelectorAll(
      ".timeFilter"
    )
    .forEach(btn=>{
      btn.classList.remove(
        "active"
      );
    });


  button.classList.add(
    "active"
  );


  findMeals();

}


function addMissingIngredients(
  mealIndex
){

  const meal =
    meals[mealIndex];

  const kitchen =
    new Set(
      inventory.map(
        normalize
      )
    );


  const missing =
    meal.ingredients.filter(
      ingredient =>
        !kitchen.has(
          normalize(
            ingredient
          )
        )
    );


  let count=0;


  missing.forEach(
    ingredient=>{

      if(
        addToGroceryList(
          ingredient,
          meal.name
        )
      ){

        count++;

      }

    }
  );


  showToast(
    count +
    " missing item" +
    (
      count===1
      ? ""
      : "s"
    ) +
    " added"
  );

}


function addSingleIngredient(
  ingredient
){

  const added =
    addToGroceryList(
      ingredient,
      "Meal"
    );


  if(added){

    showToast(
      ingredient +
      " added"
    );

  }else{

    showToast(
      ingredient +
      " is already listed"
    );

  }

}


function findMeals(){

  const kitchen =
    new Set(
      inventory.map(
        normalize
      )
    );


  const results =
    meals

    .map(
      (meal,index)=>{

        const owned =
          meal.ingredients.filter(
            ingredient =>
              kitchen.has(
                normalize(
                  ingredient
                )
              )
          );


        const missing =
          meal.ingredients.filter(
            ingredient =>
              !kitchen.has(
                normalize(
                  ingredient
                )
              )
          );


        return{
          ...meal,
          originalIndex:index,
          owned,
          missing,
          score:
            owned.length
            /
            meal.ingredients.length
        };

      }
    )

    .filter(
      meal =>
        meal.time<=cookTime
    )

    .sort(
      (a,b)=>
        b.score-a.score
        ||
        a.missing.length
        -
        b.missing.length
    );


  const container =
    document.getElementById(
      "mealResults"
    );


  container.innerHTML="";


  results.forEach(
    meal=>{

      const div =
        document.createElement(
          "div"
        );

      div.className="meal";


      let ingredientsHTML="";


      meal.ingredients.forEach(
        ingredient=>{

          const have =
            kitchen.has(
              normalize(
                ingredient
              )
            );


          ingredientsHTML +=
            have
            ?
            `
            <div class="have">
              ✓ ${ingredient}
            </div>
            `
            :
            `
            <div class="missing">
              + ${ingredient}
              <button
                class="secondary"
                style="
                  padding:5px 9px;
                  margin-left:5px;
                  font-size:11px;
                "
                onclick='addSingleIngredient(${JSON.stringify(ingredient)})'
              >
                Add
              </button>
            </div>
            `;

        }
      );


      div.innerHTML=`

        <div class="mealTop">

          <div>

            <div class="mealName">
              ${meal.name}
            </div>

            <div class="small">
              ${meal.owned.length}
              of
              ${meal.ingredients.length}
              ingredients in your kitchen
            </div>

          </div>

          <div class="time">
            ${meal.time} min
          </div>

        </div>


        <div class="ingredients">

          ${ingredientsHTML}

        </div>


        <div class="mealActions">

          ${
            meal.missing.length
            ?
            `
            <button
              class="secondary"
              onclick="addMissingIngredients(${meal.originalIndex})"
            >
              + Add ${meal.missing.length} Missing
            </button>
            `
            :
            `
            <button
              class="secondary"
            >
              ✓ Ready to Cook
            </button>
            `
          }

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );

}


/* -----------------------------
MULTI SCAN
----------------------------- */

let scannerStream=null;
let scanTimer=null;
let detector=null;
let scannedItems=[];
let lastDetected="";
let lastDetectedTime=0;


async function startScanner(){

  const status =
    document.getElementById(
      "scanStatus"
    );


  if(
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices
      .getUserMedia
  ){

    status.textContent =
      "Camera access is not supported in this browser.";

    return;

  }


  if(
    !("BarcodeDetector" in window)
  ){

    status.textContent =
      "This browser does not support the built-in QR scanner. Your regular KitchenTap QR links still work with the iPhone Camera.";

    showToast(
      "Multi Scan isn't supported by this browser yet"
    );

    return;

  }


  try{

    detector =
      new BarcodeDetector({
        formats:["qr_code"]
      });


    scannerStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:"environment"
            }
          },

          audio:false

        });


    const video =
      document.getElementById(
        "scannerVideo"
      );


    video.srcObject =
      scannerStream;


    await video.play();


    status.textContent =
      "Scanning — point at a KitchenTap QR";


    document
      .getElementById(
        "startScanButton"
      )
      .textContent =
      "Camera Running";


    scanTimer =
      setInterval(
        scanFrame,
        350
      );


  }catch(error){

    console.error(error);

    status.textContent =
      "Camera couldn't start. Check Safari camera permission.";

    showToast(
      "Camera permission needed"
    );

  }

}


async function scanFrame(){

  if(
    !detector
    ||
    !scannerStream
  )
    return;


  const video =
    document.getElementById(
      "scannerVideo"
    );


  if(
    video.readyState<2
  )
    return;


  try{

    const codes =
      await detector.detect(
        video
      );


    if(!codes.length)
      return;


    const value =
      codes[0].rawValue;


    processScannedQR(
      value
    );


  }catch(error){

    console.log(
      "Scan frame error:",
      error
    );

  }

}


function processScannedQR(value){

  const now=Date.now();


  if(
    value===lastDetected
    &&
    now-lastDetectedTime<2000
  )
    return;


  lastDetected=value;
  lastDetectedTime=now;


  let item=null;


  try{

    const url =
      new URL(value);

    item =
      url.searchParams.get(
        "add"
      );

  }catch(error){

    /*
    Allows QR codes containing
    only the item name too.
    */

    if(
      value
      &&
      value.length<100
    ){

      item=value;

    }

  }


  if(!item){

    showToast(
      "Not a KitchenTap item"
    );

    return;

  }


  item =
    String(item).trim();


  const alreadyScanned =
    scannedItems.some(
      existing =>
        normalize(existing)
        ===
        normalize(item)
    );


  if(alreadyScanned){

    showToast(
      item +
      " already scanned"
    );

    return;

  }


  scannedItems.push(
    item
  );


  renderScannedItems();


  document
    .getElementById(
      "scanStatus"
    )
    .textContent =
    "✓ " +
    item +
    " scanned";


  if(
    navigator.vibrate
  ){

    navigator.vibrate(80);

  }


  showToast(
    "✓ " + item
  );

}


function renderScannedItems(){

  const container =
    document.getElementById(
      "scannedItems"
    );


  const counter =
    document.getElementById(
      "scanCounter"
    );


  counter.textContent =
    scannedItems.length +
    " scanned";


  if(
    scannedItems.length===0
  ){

    container.innerHTML=
      `
      <div class="empty">
        No items scanned yet
      </div>
      `;

    return;

  }


  container.innerHTML =
    scannedItems
      .map(
        (item,index)=>`

        <div class="scanItem">

          <div class="itemName">
            ✓ ${item}
          </div>

          <button
            class="removeScan"
            onclick="removeScannedItem(${index})"
          >
            ×
          </button>

        </div>

        `
      )
      .join("");

}


function removeScannedItem(
  index
){

  scannedItems.splice(
    index,
    1
  );

  renderScannedItems();

}


function undoLastScan(){

  if(
    scannedItems.length===0
  ){

    showToast(
      "Nothing to undo"
    );

    return;

  }


  const removed =
    scannedItems.pop();


  renderScannedItems();


  showToast(
    removed +
    " removed"
  );

}


function clearScans(){

  scannedItems=[];

  renderScannedItems();

  showToast(
    "Scanned items cleared"
  );

}


function finishMultiScan(){

  if(
    scannedItems.length===0
  ){

    showToast(
      "Scan some items first"
    );

    return;

  }


  let added=0;


  scannedItems.forEach(
    item=>{

      if(
        addToGroceryList(
          item,
          "Multi Scan"
        )
      ){

        added++;

      }

    }
  );


  scannedItems=[];

  renderScannedItems();

  stopScanner();


  openPage(
    "groceries"
  );


  showToast(
    added +
    " item" +
    (
      added===1
      ? ""
      : "s"
    ) +
    " added to grocery list"
  );

}


function stopScanner(){

  if(scanTimer){

    clearInterval(
      scanTimer
    );

    scanTimer=null;

  }


  if(scannerStream){

    scannerStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    scannerStream=null;

  }


  const video =
    document.getElementById(
      "scannerVideo"
    );


  video.srcObject=null;

}


function closeScanner(){

  stopScanner();

  openPage(
    "home"
  );

}


/* -----------------------------
NFC / NORMAL QR LINK
----------------------------- */

function checkNFCLink(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const item =
    params.get("add");


  if(!item)
    return;


  const added =
    addToGroceryList(
      item,
      "NFC / QR"
    );


  if(added){

    showToast(
      item +
      " added"
    );

  }else{

    showToast(
      item +
      " is already on your list"
    );

  }


  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

}


/* -----------------------------
RENDER
----------------------------- */

function render(){

  /* HOME COUNTS */

  const groceryCount =
    groceries.filter(
      item=>!item.done
    ).length;


  document
    .getElementById(
      "groceryCountHome"
    )
    .textContent =
      groceryCount +
      (
        groceryCount===1
        ? " item"
        : " items"
      );


  document
    .getElementById(
      "kitchenCountHome"
    )
    .textContent =
      inventory.length +
      (
        inventory.length===1
        ? " item"
        : " items"
      );


  /* GROCERY LIST */

  const groceryList =
    document.getElementById(
      "groceryList"
    );


  if(
    groceries.length===0
  ){

    groceryList.innerHTML=
      `
      <div class="empty">
        Your grocery list is empty.
      </div>
      `;

  }else{

    groceryList.innerHTML =
      groceries
        .map(
          (item,index)=>`

          <div class="row ${
            item.done
            ?
            "groceryDone"
            :
            ""
          }">

            <div style="
              display:flex;
              align-items:center;
              gap:11px;
              flex:1;
            ">

              <input
                class="checkbox"
                type="checkbox"
                ${
                  item.done
                  ?
                  "checked"
                  :
                  ""
                }
                onchange="toggleGrocery(${index})"
              >

              <div>

                <div class="itemName">
                  ${item.name}
                </div>

                <div class="small">
                  ${item.source || ""}
                </div>

              </div>

            </div>


            <div>

              ${
                item.done
                ?
                `
                <button
                  class="secondary"
                  onclick="putInKitchen(${index})"
                >
                  Kitchen
                </button>
                `
                :
                ""
              }

              <button
                class="danger"
                onclick="deleteGrocery(${index})"
                style="padding:8px 10px;"
              >
                ×
              </button>

            </div>

          </div>

          `
        )
        .join("");

  }


  /* KITCHEN */

  const kitchenList =
    document.getElementById(
      "kitchenList"
    );


  if(
    inventory.length===0
  ){

    kitchenList.innerHTML=
      `
      <div class="empty">
        Your kitchen is empty.
      </div>
      `;

  }else{

    kitchenList.innerHTML =
      inventory
        .map(
          (item,index)=>`

          <div class="row">

            <div class="itemName">
              ${item}
            </div>

            <button
              class="danger"
              onclick="removeKitchenItem(${index})"
              style="padding:8px 11px;"
            >
              Remove
            </button>

          </div>

          `
        )
        .join("");

  }


  /* QUICK ADD */

  document
    .getElementById(
      "quickGrid"
    )
    .innerHTML =
      quickItems
        .map(
          item=>`

          <button
            class="quick"
            onclick='quickAdd(${JSON.stringify(item)})'
          >
            + ${item}
          </button>

          `
        )
        .join("");


  renderScannedItems();

  findMeals();

}


function quickAdd(item){

  const added =
    addToGroceryList(
      item,
      "Quick Add"
    );


  if(added){

    showToast(
      item +
      " added"
    );

  }else{

    showToast(
      item +
      " is already listed"
    );

  }

}


/* -----------------------------
START APP
----------------------------- */

render();
checkNFCLink();

</script>
